name: CI

# Gate parity with AGENTS.md § STANDING RULES §13 — read that section as the authority; this file
# executes the subset of it that can run without credentials, and says below why each omission is
# deliberate. If §13 changes, change this file in the same commit.
#
# GATES EXECUTED (the §13 chain minus the omissions below):
#   gate 1: pnpm typecheck
#   gate 2: pnpm test — app unit tests + the instruction-layer checker (no credentials needed)
#   gate 3: pnpm build
#
# OMISSIONS (deliberate, not oversights):
#   * `pnpm lint` — the tree is red on a recorded pre-existing ESLint census (AGENTS.md § TARGET STATE,
#     "Lint census decides CI's fourth gate"). Adding a step that fails on every push teaches nobody to read CI.
#     The gate in the meantime is "the census does not grow", which is a local, before/after check.
#   * Postgres-backed tiers — no `integration`/`e2e` tier exists, and `DATABASE_URL`/`DIRECT_URL`
#     are not repository secrets here. The money path is verified locally or not at all.
#   * `pnpm email` — unrunnable; `@react-email/ui` is not installed and the CLI stops on an
#     interactive prompt.
#
# NO SECRETS NEEDED, and that is measured, not assumed: `pnpm install --frozen-lockfile`,
# `pnpm typecheck`, `pnpm test` and `pnpm build` were all run on 2026-10-13 with `.env.local`
# removed from the checkout. Build exit 0, `Running TypeScript ... / Finished TypeScript`, 9 routes
# all `ƒ` (dynamic, so nothing is prerendered and no remote image is fetched at build time). Do not
# add a secret to this job; if a step starts needing one, that is a defect in the step.
#
# Runtime floor: package.json declares `engines.node: ">=22.21.0"` — the highest floor among the installed
# dependencies' own engines (measured 2026-10-14: @arcjet/next ">=22.21.0 <23 || >=24.5.0", vitest
# "^22.12.0 || ^24.0.0 || >=26.0.0", prisma "^20.19 || ^22.12 || >=24.0", next and @clerk/nextjs ">=20.9.0").
# Node 20 sat below three of those, enforced by nothing: pnpm checks engines only under `engine-strict`, and
# this repo has no `.npmrc`. `node-version` below is what makes the declared floor real on this runner.
#
# pnpm's version is named in the `pnpm/action-setup@v4` step, not resolved from package.json: this repo
# carries no `packageManager` field (AGENTS.md §11), so nothing auto-activates a version from the host
# runtime. Move both together.

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pnpm version lives here — package.json deliberately has no packageManager field.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (unit tier, TZ pinned by the script)
        run: pnpm test

      - name: Build (type-checks; does not lint)
        run: pnpm build
