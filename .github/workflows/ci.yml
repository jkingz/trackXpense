name: CI

# Gates (same commands, same order as local verification):
#   vp install (frozen lockfile) -> vp check -> TZ=UTC vp test -> vp run build
# Env values below are non-secret placeholders so the build can prerender
# without real credentials. Never add a repository secret to this job.

on:
  push:
    branches: [main, feat/landing-production-grade]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: install / check / test / build
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      # Non-secret placeholders for a credential-free prerender.
      DATABASE_URL: postgresql://localhost:5432/trackxpense
      DIRECT_URL: postgresql://localhost:5432/trackxpense
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dHVtbW9ocy5zaGFyZC5uZXh0LmRldiQ
      CLERK_SECRET_KEY: sk_test_dHVtbW9ocy5zaGFyZC5uZXh0LmRldiQ
      ARCJET_KEY: ajkey_dummy_placeholder_for_ci_build_only
      RESEND_API_KEY: re_dummy_placeholder_for_ci_build_only
      GEMINI_API_KEY: dummy_placeholder_for_ci_build_only
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: vp install --frozen-lockfile

      - name: Check (format + lint + types)
        run: vp check

      - name: Test
        run: vp test

      - name: Build
        run: vp run build
